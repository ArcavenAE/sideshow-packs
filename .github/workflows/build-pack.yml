name: Build pack

on:
  workflow_dispatch:
    inputs:
      pack:
        description: Pack to build
        type: choice
        options: [bmad, vsdd-factory]
        default: bmad
      version:
        description: Pack version (semver)
        type: string
        required: true
        default: "6.3.0"
      modules:
        description: "Module composition (comma-separated codes; core is always included)"
        type: string
        default: "bmm,cis,gds,tea"
      pins:
        description: "External-module pins: auto (as-of-release-date), none, or cis=v0.2.0,gds=v0.4.0,..."
        type: string
        default: "auto"
      allow_unsupported:
        description: Build a version outside the validated support bracket (best-effort; see registry/pack-support-revalidation-runbook.md)
        type: boolean
        default: false
      expected_sha:
        description: "Expected upstream commit SHA: build fails unless npm's gitHead matches (set by upstream-intake; empty skips the check)"
        type: string
        default: ""
      revision:
        description: "Packaging re-issue marker (r2, r3, ...): same upstream content, corrected packaging; release tag and artifact name carry it (empty = first issue)"
        type: string
        default: ""
      sign:
        description: Sign + attest with cosign (OIDC keyless)
        type: boolean
        default: true
      publish:
        description: Create GitHub Release and upload artifacts
        type: boolean
        default: false
  push:
    tags:
      - 'bmad-v*'
      - 'vsdd-factory-v*'

# Required for:
#   - id-token: cosign keyless OIDC signing (Sigstore / Rekor)
#   - contents: gh release create
#   - attestations: github native attestation (in addition to cosign)
permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node (for npx bmad-method)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.53.2/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Install cosign
        if: inputs.sign || github.ref_type == 'tag'
        uses: step-security/cosign-installer@7d5ca7d0ecba292387fa6f81cde2c05e53a2a6d7 # v4.1.2
        with:
          cosign-release: 'v2.4.1'

      - name: Determine pack + version
        id: params
        run: |
          # On tag push, parse "bmad-v6.3.0" → pack=bmad, version=6.3.0.
          # A trailing "-rN" is a packaging re-issue marker, split off
          # the version ("bmad-v6.10.0-r2" → version=6.10.0 revision=r2;
          # prerelease versions like 1.0.0-rc.22 are unaffected, the
          # marker is exactly -r<digits> at the end).
          REVISION=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            PACK="${TAG%%-v*}"
            VERSION="${TAG#*-v}"
            if [[ "${VERSION}" =~ ^(.+)-(r[0-9]+)$ ]]; then
              VERSION="${BASH_REMATCH[1]}"
              REVISION="${BASH_REMATCH[2]}"
            fi
          else
            PACK="${{ inputs.pack }}"
            VERSION="${{ inputs.version }}"
            REVISION="${{ inputs.revision }}"
          fi
          RELEASE_TAG="${PACK}-v${VERSION}${REVISION:+-${REVISION}}"
          RELEASE_NAME="${PACK} ${VERSION}${REVISION:+ ${REVISION}}"
          echo "pack=${PACK}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "[params] pack=${PACK} version=${VERSION} revision=${REVISION:-<none>}"

      - name: Build pack
        env:
          BMAD_VERSION: ${{ steps.params.outputs.version }}
          PACK_REVISION: ${{ steps.params.outputs.revision }}
          BMAD_MODULES: ${{ inputs.modules || 'bmm,cis,gds,tea' }}
          BMAD_PINS: ${{ inputs.pins || 'auto' }}
          EXPECTED_UPSTREAM_SHA: ${{ inputs.expected_sha || '' }}
          VSDD_VERSION: ${{ steps.params.outputs.version }}
          ALLOW_UNSUPPORTED: ${{ inputs.allow_unsupported && '1' || '0' }}
          COSIGN: ${{ (inputs.sign || github.ref_type == 'tag') && '1' || '0' }}
        run: |
          case "${{ steps.params.outputs.pack }}" in
            bmad)         bash scripts/build-bmad.sh ;;
            vsdd-factory)
              if [[ -n "${PACK_REVISION}" ]]; then
                echo "revision re-issues are not wired for vsdd-factory yet (build-vsdd-factory.sh does not consume PACK_REVISION)"; exit 1
              fi
              bash scripts/build-vsdd-factory.sh ;;
            *)            echo "unknown pack: ${{ steps.params.outputs.pack }}"; exit 1 ;;
          esac

      - name: Attest provenance (GitHub native)
        if: inputs.sign || github.ref_type == 'tag'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: 'artifacts/*-arcaven.tar.gz'

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.params.outputs.pack }}-${{ steps.params.outputs.version }}${{ steps.params.outputs.revision && format('-{0}', steps.params.outputs.revision) || '' }}
          path: artifacts/
          if-no-files-found: error

      - name: Create GitHub Release
        if: inputs.publish || github.ref_type == 'tag'
        uses: step-security/action-gh-release@d2093dbdaf0c6507874908247e14bbc4dee6a72d # v3.0.1
        with:
          name: ${{ steps.params.outputs.release_name }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.params.outputs.release_tag }}
          draft: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.sig
            artifacts/*.bundle
            artifacts/install.meta.yaml
            artifacts/install.meta.json
            artifacts/file-manifest.csv
            artifacts/exec-manifest.txt
