name: Intake tests

# Scenario tests for the upstream-intake state machine. Fixture-driven
# through the script's test seams: no network, no mutations.

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/upstream-intake.yml'
      - '.github/workflows/intake-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.53.2/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Run scenario tests
        run: bash scripts/test-upstream-intake.sh
