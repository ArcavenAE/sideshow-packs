name: Upstream intake

# Scheduled detection of new upstream pack releases, with a soak window
# and a tag-SHA stability check before any build is dispatched.
# bd: aae-orc-4t1k. Logic lives in scripts/upstream-intake.sh; this
# workflow is the thin runner.

on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report every action without dispatching, writing state, or opening issues
        type: boolean
        default: false
      soak_hours:
        description: Hours a release must age upstream before packaging
        type: string
        default: '72'
      max_dispatch:
        description: Per-run dispatch cap (dropped count is logged)
        type: string
        default: '3'

# contents: write -> gh release edit --latest (marker self-heal uses
#                    the update-release endpoint)
# actions: write  -> dispatch build-pack.yml
# issues: write   -> observation-ledger issue + SHA-drift quarantine
#                    and revalidation reports
permissions:
  contents: write
  actions: write
  issues: write

# A scheduled run and a manual run reading the same ledger must not
# race: duplicate dispatches plus a lost ledger write.
concurrency:
  group: upstream-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.53.2/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Run intake
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          SOAK_HOURS: ${{ inputs.soak_hours || '72' }}
          MAX_DISPATCH: ${{ inputs.max_dispatch || '3' }}
        run: bash scripts/upstream-intake.sh
