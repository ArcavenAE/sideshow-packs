id: question-what-ships-inside-the-tarball
type: question
confidence: frontier
title: "Which build outputs must travel inside the signed tarball, and how is that checked?"
tags:
  - sideshow-packs
  - provenance
content: |
  finding-002: a build output written only beside the tarball never
  reaches the installing machine. file-manifest.csv now travels inside
  (#40); exec-manifest.txt does not, so sideshow's install-time exec-bit
  check is silently off for a tarball install.

  finding-003: verify-artifact.sh, which asserts the artifact contract,
  runs by hand only; the runbook now says so (85fd4c4).

  finding-004: the identity neutralization edits nine config files after
  bmad records them in its own census, so a clean r2 install fails
  doctor's census (#41).

  finding-005: the 4ptdd panel checked where a rewrite record can live.
  install.meta is a release asset only, absent from the tarball and the
  store, so any record doctor reads at runtime must sit in the in-store
  pack.yaml. The panel accepted 5 to 0 that the build refreshes the
  census after the neutralizer, re-runs it on the staged tree, and
  records the rewrites there (sideshow-packs#44).

  Open:
  - Should every output that an installer may check (exec manifest,
    install.meta facts) travel inside the tarball?
  - Should CI run the structural checks in verify-artifact.sh?
  - Should any step that edits staged content after the upstream
    installer refresh the upstream census it invalidates?
