wrinkles:
  - id: no-pin-mechanism
    introduced_in: null
    resolved_in: 6.4.0
    severity: blocking-for-reproducibility
    summary: >-
      No mechanism of any kind (flag/env/config/lockfile) to pin
      external module versions; installer clones default-branch HEAD.
      Compositions at these versions are build-time-recorded only and
      permanently unreproducible in-contract.
    adaptation: >-
      BMAD_PINS=auto refuses non-auto pin requests below 6.4.0 and
      records pin_policy=unpinned-no-mechanism-at-this-version in
      install.meta.json. Frozen-composition baseline moved to >=6.4.0.
    references:
      - aae-orc:_kos/findings/finding-070 (resolution model)
      - upstream tools/installer external-manager.js @ v6.3.0 (git clone --depth 1, no ref)

  - id: pin-flag-available
    introduced_in: 6.4.0
    resolved_in: null
    severity: capability
    summary: >-
      --pin CODE=TAG (repeatable) pins external modules to exact git
      tags; channel-resolver resolves default 'stable' = highest
      pure-semver tag. CAUTION: malformed pins WARN AND ARE IGNORED
      upstream — the pipeline must verify resolved versions itself.
    adaptation: >-
      build-bmad.sh BMAD_PINS (auto = as-of-release-date resolution
      against module repo git tags; explicit CSV supported) + fatal
      post-install verification against manifest.
    references:
      - upstream channel-resolver.js / channel-plan.js @ >=6.4.0
      - sideshow-packs 1bf95fe (pinning) + 18a1cce (verification fix)

  - id: manifest-version-v-prefix
    introduced_in: 6.4.0
    resolved_in: null
    severity: adaptation-shipped
    summary: >-
      manifest.yaml module versions switch from bare ("0.2.0") at
      6.3.x to tag-verbatim ("v0.2.0") at >=6.4.0. Any consumer
      comparing versions must normalize the v-prefix on both sides.
    adaptation: build-bmad.sh pin verification normalizes both sides (18a1cce).
    references:
      - run 29201456602 (false-positive PIN DRIFT before the fix)

  - id: upstream-custom-dir
    introduced_in: 6.4.0
    resolved_in: null
    severity: consumer-convention
    summary: >-
      _bmad/custom/ TOML customization + bmad-customize skill. Collides
      with sideshow's per-repo _<pack>-custom/ convention unless bridged.
    adaptation: >-
      pack.yaml distribute.custom_bridge (emitted for all bmad bundles;
      inert pre-6.4) + sideshow custom-bridge implementation (PR #47).
    references:
      - sideshow:docs/customization-bridge.md
      - aae-orc:_kos/findings/finding-035 (collision first observed)

  - id: tools-flag-required
    introduced_in: 6.6.0
    resolved_in: null
    severity: adaptation-not-needed
    summary: >-
      BREAKING upstream #2346: --tools none removed; --tools REQUIRED
      for --yes fresh installs. Pipelines omitting --tools break here.
    adaptation: pipeline always passed --tools claude-code; no change needed.
    references:
      - upstream PR #2346

  - id: node-engine-floor-20-12
    introduced_in: 6.7.0
    resolved_in: null
    severity: environment-gate
    summary: >-
      engines floor rises >=20.0.0 -> >=20.12.0 with the module-resolution
      rewrite (commit 74cf467d, marketplace registry retired,
      bmad-modules.yaml becomes sole module source). Most likely silent
      break for stale runners.
    adaptation: CI setup-node '20' resolves latest 20.x (compliant). Verify on runner changes.
    references:
      - upstream commit 74cf467d / PR #2388

  - id: wds-unprefixed-skill-names
    introduced_in: 6.7.0
    resolved_in: null
    severity: collision-risk
    summary: >-
      The wds module ships two skills with generic un-namespaced names
      ('memory', 'sync') that land bare in the global skills dir.
      Collision bait against any other pack or user skill claiming
      those names; sync's last-writer-wins would silently shadow.
    adaptation: >-
      Upstream issue filed: bmad-code-org/bmad-method-wds-expansion#38
      (rename to wds-memory / wds-sync). Inline patching deliberately
      deferred — content renames are overlay territory (10vq).
      Sideshow-side sync-time collision detection ticketed
      (cross-pack owner check against the sync-manifest ledger).
    references:
      - expanded re-issue 2026-07-12 (bmb+wds composition)
      - https://github.com/bmad-code-org/bmad-method-wds-expansion/issues/38

  - id: runtime-skills-write-project-files
    introduced_in: 6.7.0
    resolved_in: null
    severity: store-integrity
    summary: >-
      Activation-time helper skills (wds sync "called automatically on
      every agent activation"; bmb setup) perform project file
      operations that assume a writable {project-root}/_bmad. Under a
      shared-store install model with read-substitution fallback, those
      writes land in the store: observed 2026-07-12 — _config/, core/,
      bmb/ deleted from the active store version during a party-mode
      run (aae-orc finding-074).
    adaptation: >-
      SHIPPED (sideshow PR #55, 2026-07-12): runtime_links shim makes
      project-root read surfaces real (roster resolves, 21 members);
      fallback footer now READ-ONLY; store frozen (interim chmod;
      install-freeze feature aae-orc-dihj remains). Resolution model:
      sideshow docs/path-resolution.md.
    references:
      - aae-orc:_kos/findings/finding-074-party-mode-store-corruption-write-through-fallback.md

  - id: uv-check-stdout-noise
    introduced_in: 6.9.0
    resolved_in: null
    severity: cosmetic
    summary: >-
      uv-check.js emits warn-only 'uv' tooling advice on stdout during
      install (never blocks, even under --yes). Do not treat as failure.
    adaptation: none needed; noted so log-watchers don't false-alarm.
    references:
      - upstream commit 02739932 / PR #2495

  # ---- 6.11.0 (bracket extended 2026-08-28; all three runbook steps
  # ran. The header this replaced still said Steps 2/3 had not run,
  # which the validated block above had already contradicted.) ----

  - id: render-dir-under-bmad
    introduced_in: 6.11.0
    resolved_in: null
    severity: adaptation-not-needed
    summary: >-
      Skills render through _bmad/scripts/render_skill.py into a new
      content-addressed snapshot tree at _bmad/render/, each generation
      carrying manifest.json with renderer/source hashes. manifest-generator
      excludes the name 'render' from module enumeration so the snapshot dir
      is not mistaken for a module.
    adaptation: >-
      None. Output still lands under _bmad/ (bmad-output-dir holds) and the
      module list shape is unchanged (manifest-shape holds). Recorded because
      file_count and file-manifest.csv will grow by the snapshot tree, which
      would otherwise read as unexplained drift in a parity comparison.
    references:
      - upstream #2601, #2657
      - tools/installer/core/manifest-generator.js (render exclusion)

  - id: git-env-sanitization
    introduced_in: 6.11.0
    resolved_in: null
    severity: adaptation-not-needed
    summary: >-
      New tools/installer/modules/git-env.js strips repo-targeting variables
      (GIT_DIR, GIT_WORK_TREE, GIT_CONFIG_PARAMETERS, the enumerated
      GIT_CONFIG_KEY_n form, and siblings) from the environment of every git
      subprocess used for external-module cache clone/fetch/checkout.
    adaptation: >-
      None needed, and it removes a latent hazard for us: our builds clone
      external modules inside CI, where an inherited GIT_DIR would have
      retargeted those operations. Pin/tag fetch mechanics are otherwise
      unchanged, so module-set holds.
    references:
      - tools/installer/modules/external-manager.js (all execSync calls now pass gitEnv())

  - id: uv-hard-requirement-rendered-skills
    introduced_in: 6.11.0
    resolved_in: null
    severity: consumer-environment
    summary: >-
      uv with Python 3.11+ becomes a hard requirement for rendered skills:
      bmad-build and bmad-build-auto halt outright when uv is unavailable
      (no interpreter fallback). The installer's own uv-check.js is
      explicitly warn-don't-block, so packaging is unaffected.
    adaptation: >-
      No packaging change; the CI runner needs no uv to BUILD the pack. This
      is a consumer-side prerequisite and belongs in the release notes:
      installing the pack does not install uv, and the failure surfaces later,
      at skill-run time, not at install.
    references:
      - upstream #2281, #2601
      - tools/installer/core/uv-check.js

  - id: platform-antigravity-cli
    introduced_in: 6.11.0
    resolved_in: null
    severity: adaptation-not-needed
    summary: >-
      New installer target 'antigravity-cli' (.agents/skills, global
      ~/.gemini/antigravity-cli/skills), distinct from the Antigravity IDE
      entry so the two cannot collide.
    adaptation: None. We build with --tools claude-code; claude-sibling holds.
    references:
      - upstream #2551
      - tools/installer/ide/platform-codes.yaml

  - id: skill-catalog-consolidation-v6-shims
    introduced_in: 6.11.0
    resolved_in: null
    severity: consumer-migration
    summary: >-
      Large catalog reduction. Core drops fourteen skills to eight: the three
      review skills plus two editorial skills become lenses on one
      bmad-review; three research skills become bmad-deep-recon;
      bmad-document-project + bmad-generate-project-context become
      bmad-project-context. bmad-quick-dev -> bmad-build, bmad-dev-auto ->
      bmad-build-auto. Retired IDs forward through v6-shims/ until the v7 cut.
      bmad-agent-tech-writer (Paige) and bmad-check-implementation-readiness
      are removed outright and listed in removals.txt; bmad-index-docs and
      bmad-shard-doc are removed. bmad-spec moves from core into bmm.
    adaptation: >-
      Packaging absorbs this (removals.txt processing shipped, aae-orc-z2zu),
      but two consumer-visible effects must be stated at release: the synced
      binding count drops, and the [agents.*] roster loses Paige, so party
      mode convenes a smaller cast. Verify the removals.txt processor runs
      against this release rather than assuming it.
    references:
      - upstream #2603, #2608, #2611, #2651, #2658, #2659, #2674
      - aae-orc-z2zu (removals.txt processor)

  - id: customization-file-renames
    introduced_in: 6.11.0
    resolved_in: null
    severity: consumer-migration
    summary: >-
      Renamed skills require renamed customization files:
      _bmad/custom/bmad-quick-dev{,.user}.toml -> bmad-build{,.user}.toml,
      bmad-dev-auto -> bmad-build-auto, bmad-sprint-status ->
      bmad-sprint-planning, bmad-document-project /
      bmad-generate-project-context -> bmad-project-context. The shim offers
      migration but requires explicit approval and never overwrites; declined
      or unavailable, it HALTS rather than forwarding.
    adaptation: >-
      Load-bearing for the sideshow customization bridge: those files live in
      the consumer's _bmad-custom/, which the bridge symlinks to
      _bmad/custom/. Upgrading the pack does not rename them, so an unattended
      run on an old name with a legacy customization file refuses to start.
      Release notes must name the files to rename. Also note config now
      resolves as a four-file layered TOML chain
      (config.toml -> config.user.toml -> custom/config.toml ->
      custom/config.user.toml).
    references:
      - upstream #2651, #2659, #2674, #2281

  # ---- 6.12.0 (bracket extended 2026-09-08; all three runbook steps ran) ----

  - id: shims-opt-in-fresh-install
    introduced_in: 6.12.0
    resolved_in: null
    severity: consumer-migration
    summary: >-
      Deprecated v6-shim skills become opt-in. New --shims / --no-shims flags;
      with neither, inferShimPreference returns false for a fresh install, so
      a non-interactive build ships no shims at all. Our 6.11.0 pack carried
      20 of them, 32 files (bmad-create-prd, bmad-create-story,
      bmad-dev-story, bmad-quick-dev, bmad-validate-prd and the rest); the
      6.12.0 pack carries none, and the retired IDs stop resolving. A shim is
      marked by metadata.lifecycle: shim in its own SKILL.md, not by living
      under v6-shims/: bmad-generate-project-context sits in plan/ beside live
      skills and gains the marker at this version.
      The installer also writes installation.installShims into manifest.yaml
      whenever shims are available.
    adaptation: >-
      None to the pipeline: --yes returns before the confirm prompt and again
      before the TTY guard, so there is no hang, and the default matches what
      an ordinary `npx bmad-method install` does on a fresh tree. This is a
      release-notes obligation, not a build change. Anyone still invoking a
      retired v6 name must move to its replacement; adding --shims to the
      build argv would restore them if we ever decide the pack should differ
      from the upstream default. manifest-shape still holds (installShims is
      an added key beside .modules, not a reshape).
    references:
      - upstream v6.12.0 release notes ("Deprecated shims are opt-in on fresh installs")
      - tools/installer/core/shim-policy.js (new at this version)
      - tools/installer/ui.js _selectShimPreference (the --yes / non-TTY guards)

  - id: checkpoint-preview-renamed-walkthrough
    introduced_in: 6.12.0
    resolved_in: null
    severity: consumer-migration
    summary: >-
      bmad-checkpoint-preview becomes bmad-walkthrough (code CK -> WT). The
      old ID forwards only through a shim, and shims are off by default at
      this version, so in our pack the old name simply does not exist.
    adaptation: >-
      Release notes name the rename explicitly. Customization files follow the
      6.11.0 pattern: _bmad/custom/bmad-checkpoint-preview{,.user}.toml must be
      renamed to bmad-walkthrough{,.user}.toml, and those files live in the
      consumer's _bmad-custom/ where a pack upgrade does not touch them.
    references:
      - upstream v6.12.0 release notes
      - see also customization-file-renames (6.11.0), same failure shape

  - id: pycache-filtered-from-skill-copies
    introduced_in: 6.12.0
    resolved_in: null
    severity: adaptation-not-needed
    summary: >-
      The skill copier now skips __pycache__ directories and .pyc/.pyo files.
      Our 6.11.0 pack shipped 5 compiled Python artefacts under
      .claude/skills/bmad-{retrospective,sprint-planning}/scripts/; the 6.12.0
      pack ships none.
    adaptation: >-
      None. Recorded so the file-count drop reads as intended upstream
      hygiene rather than a packaging regression.
    references:
      - tools/installer/ide/_config-driven.js (skipPatterns / skipSuffixes)

  - id: platform-grok-polytoken-zcode
    introduced_in: 6.12.0
    resolved_in: null
    severity: adaptation-not-needed
    summary: >-
      Three installer targets added to platform-codes.yaml: grok, polytoken,
      zcode. The claude-code entry is untouched.
    adaptation: None. We build with --tools claude-code; claude-sibling holds.
    references:
      - tools/installer/ide/platform-codes.yaml

  - id: user-scope-defaults-in-config-toml
    introduced_in: 6.12.1
    resolved_in: null
    severity: adaptation-not-needed
    summary: >-
      The installer now writes the plain module.yaml defaults of user-scope
      keys into the central config.toml (no placeholders, no result
      transform), so a clone without config.user.toml still resolves them
      (upstream #3016). In a 6.12.1 build config.toml carries
      user_name = "BMad".
    adaptation: >-
